name: CI

# Runs typecheck + lint + the full Jest suite on every push to master and on
# every pull request. The Amplify build (amplify.yml) ALSO runs the suite as the
# real deploy gate; this workflow gives fast per-commit signal on GitHub and a
# required status check for PRs (enable branch protection on master — see
# docs/CI_CD.md).
on:
  push:
    branches: [master]
  pull_request:

# Cancel an in-flight run when new commits land on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # v5 runs on the Node 24 action runtime. On v4 the runner reported
      # "Node.js 20 is deprecated … being forced to run on Node.js 24", which
      # means the action was executing on a runtime it was not built for.
      # (This only affects how the ACTIONS run; `node-version` below still
      # decides what the `run:` steps use.)
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      # The project pins legacy-peer-deps (matches amplify.yml); keep parity.
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # Prove which Node actually ran the steps. A mismatch against the
      # node-version above is itself the bug, and without this line a
      # version-specific failure is indistinguishable from a code failure.
      - name: Environment
        run: |
          node --version
          npm --version
          echo "cores: $(nproc)  mem: $(free -g | awk '/^Mem:/{print $2}')GB"

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # 385 jsdom suites. Two guards, because a jest worker that dies exits 1
      # with NO failing assertion reported — indistinguishable from a real test
      # failure in the summary, which is exactly how this presented:
      #   --maxWorkers=2       bounds concurrent jsdom environments
      #   --workerIdleMemoryLimit  recycles a worker before it grows unbounded
      # --forceExit is deliberately NOT used: it would mask a genuine open
      # handle rather than surface it.
      - name: Test
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm test -- --ci --maxWorkers=2 --workerIdleMemoryLimit=512MB

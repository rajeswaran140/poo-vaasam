version: 1
# Custom response headers applied by Amplify Hosting's CDN. Needed for the
# /clips/** static assets (Status-share clips + posters): they're served straight
# from the CDN/S3 origin, so next.config headers() never reaches them — the
# platform default (max-age=5) re-downloaded the ~1.3 MB clip on every repeat
# visit and every Web Share file fetch. They're content-stable (filename pins
# content), so cache them for a year, immutable.
customHeaders:
  - pattern: '/clips/**'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
frontend:
  phases:
    preBuild:
      commands:
        - echo "Starting preBuild at $(date)"
        # Pin Node 20 (matches local/CI) — Amplify's default Node 22 fails to
        # resolve `next/jest` when jest parses the TS config (jest.config.ts).
        - nvm install 20 && nvm use 20
        - node -v
        - npm config set legacy-peer-deps true
        # --include=dev: Amplify installs in production mode (devDeps omitted).
        # next build auto-installs typescript when missing, which masked this —
        # but jest has no such bootstrap, so the test gate needs devDeps present.
        - npm install --legacy-peer-deps --include=dev
        - echo "Dependencies installed at $(date)"
        # DEPLOY GATE: run the Jest suite before building. A failing test aborts
        # preBuild, so the build never runs and nothing is deployed to prod.
        # (tsc + eslint are already enforced inside `next build` below.)
        # NOTE: invoke jest's entry directly, NOT `npm test` / the `jest` bin —
        # Amplify's node_modules cache restore drops the node_modules/.bin
        # symlinks, so the bare `jest` command is "not found" even though the
        # package is installed. `node node_modules/jest/bin/jest.js` is immune.
        # NODE_ENV=test is required: Amplify's build sets NODE_ENV=production, which
        # makes React/testing-library load production bundles (React.act is stubbed →
        # every component test fails). Jest only auto-sets NODE_ENV=test when unset.
        - echo "Running test suite (deploy gate) at $(date)"
        - NODE_ENV=test node node_modules/jest/bin/jest.js --ci
        - echo "Tests passed at $(date)"
    build:
      commands:
        - echo "Starting build at $(date)"
        - |
          cat > .env.production.local << EOF
          APP_AWS_ACCESS_KEY_ID=$APP_AWS_ACCESS_KEY_ID
          APP_AWS_SECRET_ACCESS_KEY=$APP_AWS_SECRET_ACCESS_KEY
          DYNAMODB_TABLE_NAME=$DYNAMODB_TABLE_NAME
          S3_BUCKET=$S3_BUCKET
          S3_REGION=$S3_REGION
          AWS_REGION=$AWS_REGION
          GOOGLE_TTS_CREDENTIALS_BASE64=$GOOGLE_TTS_CREDENTIALS_BASE64
          OPENAI_API_KEY=$OPENAI_API_KEY
          ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY
          GEMINI_API_KEY=$GEMINI_API_KEY
          GEMINI_MODEL=$GEMINI_MODEL
          COMPOSER_ENGINE=$COMPOSER_ENGINE
          EOF
        - echo "Environment file created with credentials"
        - npm run build
        - echo "Build completed at $(date)"
    postBuild:
      commands:
        - echo "Deployment preparation complete at $(date)"
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*

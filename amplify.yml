version: 1
# Custom response headers applied by Amplify Hosting's CDN. Needed for the
# /clips/** static assets (Status-share clips + posters): they're served straight
# from the CDN/S3 origin, so next.config headers() never reaches them — the
# platform default (max-age=5) re-downloaded the ~1.3 MB clip on every repeat
# visit and every Web Share file fetch. They're content-stable (filename pins
# content), so cache them for a year, immutable.
customHeaders:
  - pattern: '/clips/**'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
frontend:
  phases:
    preBuild:
      commands:
        - echo "Starting preBuild at $(date)"
        - npm config set legacy-peer-deps true
        - npm install --legacy-peer-deps
        - echo "Dependencies installed at $(date)"
        # DEPLOY GATE: run the Jest suite before building. A failing test aborts
        # preBuild, so the build never runs and nothing is deployed to prod.
        # (tsc + eslint are already enforced inside `next build` below.)
        - echo "Running test suite (deploy gate) at $(date)"
        - npm test -- --ci
        - echo "Tests passed at $(date)"
    build:
      commands:
        - echo "Starting build at $(date)"
        - |
          cat > .env.production.local << EOF
          APP_AWS_ACCESS_KEY_ID=$APP_AWS_ACCESS_KEY_ID
          APP_AWS_SECRET_ACCESS_KEY=$APP_AWS_SECRET_ACCESS_KEY
          DYNAMODB_TABLE_NAME=$DYNAMODB_TABLE_NAME
          S3_BUCKET=$S3_BUCKET
          S3_REGION=$S3_REGION
          AWS_REGION=$AWS_REGION
          GOOGLE_TTS_CREDENTIALS_BASE64=$GOOGLE_TTS_CREDENTIALS_BASE64
          OPENAI_API_KEY=$OPENAI_API_KEY
          ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY
          EOF
        - echo "Environment file created with credentials"
        - npm run build
        - echo "Build completed at $(date)"
    postBuild:
      commands:
        - echo "Deployment preparation complete at $(date)"
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
